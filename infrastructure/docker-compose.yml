services:

  postgres:
    image: postgres:17
    container_name: studypilot-postgres

    environment:
      POSTGRES_DB: studypilot
      POSTGRES_USER: studypilot
      POSTGRES_PASSWORD: studypilot_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: